# Ollama es un servicio externo (mismo host u otra máquina de la LAN, ya
# desplegado) — no se define aquí. Ver CLAUDE.md sección "Conexión a
# Ollama". Valores reales en .env (ver .env.example).
services:
  ragvault-backend:
    build: ./backend
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux, solo aplica si Ollama está en el mismo host
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      # Futuro: montar carpeta de documentos de un NAS Synology (SMB/NFS)
      # como fuente adicional de ingesta, en solo lectura. Ver
      # openspec/changes/ para el change `document-source-synology` cuando
      # se decida implementarlo.
      #
      # SMB (CIFS):
      # - type: volume
      #   source: synology-docs
      #   target: /mnt/synology-docs
      #   read_only: true
      #
      # NFS:
      # - type: volume
      #   source: synology-docs-nfs
      #   target: /mnt/synology-docs
      #   read_only: true

  ragvault-frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "9009:5173" # acceso web: http://localhost:9009
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - ragvault-backend

# Futuro: definir aquí el volumen SMB/NFS del Synology cuando se implemente
# la fuente de documentos externa. Ejemplo (SMB/CIFS):
#
# volumes:
#   synology-docs:
#     driver: local
#     driver_opts:
#       type: cifs
#       o: "username=<user>,password=<password>,vers=3.0,ro"
#       device: "//<synology-ip>/<recurso-compartido>"
#
# Ejemplo (NFS):
#
# volumes:
#   synology-docs-nfs:
#     driver: local
#     driver_opts:
#       type: nfs
#       o: "addr=<synology-ip>,ro,nolock,soft"
#       device: ":/volume1/<recurso-compartido>"
