[project]
name = "ragvault-backend"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
    "httpx",
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-ollama",
    "chromadb",
    "pypdf",
    "python-docx",
    "openpyxl",
    "odfpy",
    "python-pptx",
    "sqlalchemy",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
